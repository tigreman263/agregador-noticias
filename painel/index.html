<title>Agregador de Notícias</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha512-xeUh+KxNyTufZOje++oQHstlMQ8/rpyzPuM+gjMFYK3z5ILJGE7l2NvYL+XfliKURMpBIKKp1XoPN/qswlSMFA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<style>
:root{
  --bg:#F6F3EE;--surface:#FFFFFF;--surface2:#FBF9F5;--line:#E6E0D5;--line2:#D9D3C7;
  --text:#1B1A17;--muted:#5F5B52;--accent:#0F5C56;--accent-ink:#FFFFFF;
  --accent-soft:#DDEEEA;--accent-soft-ink:#0B4741;
  --hi-bg:#F8DAD6;--hi-ink:#8C1D18;--md-bg:#F5E4BF;--md-ink:#6B4700;--lo-bg:#E2EBD8;--lo-ink:#3F5A2E;
  --neu-bg:#ECE8DF;--neu-ink:#4A463E;--danger:#8C1D18;--banner:#1B1A17;--banner-ink:#F6F3EE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151512;--surface:#1F1E1A;--surface2:#191814;--line:#33302A;--line2:#4A453C;
    --text:#F1EEE7;--muted:#B0AA9D;--accent:#4FB3A9;--accent-ink:#0B1F1D;
    --accent-soft:#1F3A37;--accent-soft-ink:#9FDDD5;
    --hi-bg:#4A2321;--hi-ink:#F5B5AF;--md-bg:#45361A;--md-ink:#F0D28A;--lo-bg:#2B3823;--lo-ink:#BFD7A9;
    --neu-bg:#2C2A25;--neu-ink:#CFC9BB;--danger:#F0A29B;--banner:#F1EEE7;--banner-ink:#151512;
  }
}
:root[data-theme="dark"]{
  --bg:#151512;--surface:#1F1E1A;--surface2:#191814;--line:#33302A;--line2:#4A453C;
  --text:#F1EEE7;--muted:#B0AA9D;--accent:#4FB3A9;--accent-ink:#0B1F1D;
  --accent-soft:#1F3A37;--accent-soft-ink:#9FDDD5;
  --hi-bg:#4A2321;--hi-ink:#F5B5AF;--md-bg:#45361A;--md-ink:#F0D28A;--lo-bg:#2B3823;--lo-ink:#BFD7A9;
  --neu-bg:#2C2A25;--neu-ink:#CFC9BB;--danger:#F0A29B;--banner:#F1EEE7;--banner-ink:#151512;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.4}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.banner{background:var(--banner);color:var(--banner-ink);text-align:center;font-size:12px;font-weight:600;padding:6px 12px}
.banner.ok{background:var(--accent);color:var(--accent-ink)}
main{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 28px}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
button{font-family:inherit;font-size:14px;cursor:pointer}
.btn{min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-line{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn-danger{border-color:var(--danger);color:var(--danger);font-weight:600}
.btn-sm{min-height:34px;padding:0 10px;border-radius:10px;font-size:13px}
.btn.block{width:100%}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px;font-family:'Newsreader',Georgia,serif}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neu-bg);color:var(--neu-ink);white-space:nowrap}
.tag.ok{background:var(--lo-bg);color:var(--lo-ink)}.tag.warn{background:var(--md-bg);color:var(--md-ink)}.tag.bad{background:var(--hi-bg);color:var(--hi-ink)}.tag.info{background:var(--accent-soft);color:var(--accent-soft-ink)}
a{color:var(--accent)}
.title-link{color:var(--text);font-weight:600;text-decoration:none}
.title-link:hover{text-decoration:underline}
label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;font:inherit;font-size:15px;padding:9px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--text)}
textarea{min-height:64px;resize:vertical}
.field{margin-bottom:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.check input{width:20px;height:20px}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.err{color:var(--danger);font-size:13px}
.doc{font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.doc h1{font-size:26px;margin:4px 0 10px}.doc h2{font-size:21px;margin:26px 0 8px;padding-top:12px;border-top:1px solid var(--line)}.doc h3{font-size:17px;margin:18px 0 6px}
.doc p,.doc ul,.doc ol{margin:8px 0}.doc li{margin-bottom:4px}
.doc pre{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-size:12px}
.doc pre code{border:0;padding:0;background:none;word-break:normal;white-space:pre}
.doc hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.doc .tabela{overflow-x:auto;margin:8px 0}
.doc table{border-collapse:collapse;font-size:13px;min-width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--surface2)}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{border:0;background:transparent;color:var(--muted);padding:10px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .ic{font-size:18px;line-height:1}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.2)}
details summary{cursor:pointer;font-weight:600;font-size:14px}
code{font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;overflow-wrap:anywhere}
.guia{background:var(--accent-soft);color:var(--accent-soft-ink);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.guia summary{color:inherit}
.guia ol{margin:8px 0 6px}
.exp{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere;margin-bottom:6px}
.exp h3{margin:4px 0 0;font-size:15px}
.passo{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
::placeholder{color:var(--muted);opacity:.7}
ol{padding-left:20px;margin:6px 0}
ol li{margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner">A carregar…</div>
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" aria-label="Secções">
    <button class="tab" data-tab="inicio"><span class="ic" aria-hidden="true">◉</span>Início</button>
    <button class="tab" data-tab="pesquisas"><span class="ic" aria-hidden="true">⌕</span>Pesquisas</button>
    <button class="tab" data-tab="atividade"><span class="ic" aria-hidden="true">≡</span>Atividade</button>
    <button class="tab" data-tab="fontes"><span class="ic" aria-hidden="true">◈</span>Fontes</button>
    <button class="tab" data-tab="ligacao"><span class="ic" aria-hidden="true">⚙</span>Ligação</button>
    <button class="tab" data-tab="ajuda"><span class="ic" aria-hidden="true">?</span>Ajuda</button>
  </nav>
</div>
<script>
"use strict";
// ------------------------------------------------------------ armazenamento local
const WORKER_OMISSAO = "https://agregador-noticias.investrade-telmosilva.workers.dev";
const LS_LIG = "agregador.ligacao", LS_TOKEN = "agregador.token", LS_TAB = "agregador.tab", LS_LIMPO = "agregador.limpoAte";
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

const S = {
  repo: (function () { try { return JSON.parse(lsGet(LS_LIG, "{}")).repo || "tigreman263/agregador-noticias"; } catch (e) { return "tigreman263/agregador-noticias"; } })(),
  worker: (function () { try { return JSON.parse(lsGet(LS_LIG, "{}")).worker || WORKER_OMISSAO; } catch (e) { return WORKER_OMISSAO; } })(),
  ramo: "main",
  token: lsGet(LS_TOKEN, ""),
  tab: lsGet(LS_TAB, "inicio"),
  config: null, estado: null, runs: [], erroCarga: "", descartados: [],
  editar: null,          // índice da pesquisa em edição (-1 = nova)
  rascunho: null,        // o que está escrito no formulário (não se perde ao redesenhar)
  exp: null,             // resultado do botão Experimentar
  ocupado: false, aSeguir: null,
};
const WORKFLOW = "agregador.yml";

// ------------------------------------------------------------ utilitários
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function num(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function urlSegura(u) { return /^https?:\/\//i.test(String(u || "")) ? String(u) : "#"; }
function quando(iso) {
  if (!iso) return "—";
  const d = new Date(iso); if (isNaN(d)) return "—";
  const min = Math.floor((Date.now() - d) / 60000);
  if (min < 1) return "agora mesmo";
  if (min < 60) return "há " + min + " min";
  if (min < 48 * 60) return "há " + Math.floor(min / 60) + " h";
  return d.toLocaleDateString("pt-PT", { day: "numeric", month: "short" });
}
function hora(iso) { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("pt-PT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
function lista(txt) { return String(txt || "").split(/[\n,]/).map(s => s.trim()).filter(Boolean); }
function dominio(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return String(u || "").replace(/^www\./, ""); } }
let toastT;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 5000);
}
function b64dec(s) { const bin = atob(String(s).replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function b64enc(str) { const by = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); }

// ------------------------------------------------------------ GitHub
async function gh(caminho, opts) {
  opts = opts || {};
  const h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (S.token) h["Authorization"] = "Bearer " + S.token;
  if (opts.body) h["Content-Type"] = "application/json";
  let r;
  try {
    r = await fetch("https://api.github.com" + caminho, { method: opts.method || "GET", headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: "no-store" });
  } catch (e) { throw new Error("Sem ligação ao GitHub. Confirma a internet."); }
  if (r.status === 204) return null;
  let dados = null; try { dados = await r.json(); } catch (e) {}
  if (!r.ok) {
    const m = (dados && dados.message) || "";
    if (r.status === 401) throw new Error("O token não é válido ou expirou. Cria outro em Ligação.");
    if (r.status === 403 && /rate limit/i.test(m)) throw new Error("O GitHub limitou os pedidos sem token. Junta um token em Ligação ou espera uma hora.");
    if (r.status === 403 || (r.status === 404 && S.token && opts.method)) throw new Error("O token não tem permissão para isto. Confirma as permissões em Ligação.");
    if (r.status === 404) throw new Error("Não encontrei o repositório ou o ficheiro (" + caminho.split("?")[0] + ").");
    if (r.status === 409) throw new Error("O ficheiro mudou entretanto. Tenta outra vez.");
    throw new Error("O GitHub respondeu " + r.status + (m ? ": " + m : ""));
  }
  return dados;
}
async function lerFicheiro(caminho) {
  const d = await gh("/repos/" + S.repo + "/contents/" + caminho + "?ref=" + S.ramo);
  return { texto: b64dec(d.content), sha: d.sha };
}
async function gravarFicheiro(caminho, texto, sha, mensagem) {
  if (!S.token) throw new Error("Para gravar, junta primeiro um token em Ligação.");
  return gh("/repos/" + S.repo + "/contents/" + caminho, { method: "PUT", body: { message: mensagem, content: b64enc(texto), sha: sha, branch: S.ramo } });
}

// ------------------------------------------------------------ config.yaml (mantém os comentários fora da secção mudada)
function ychave(k) { return /^[A-Za-z_][\w-]*$/.test(k) ? k : JSON.stringify(String(k)); }
function yv(v) {
  if (Array.isArray(v)) return "[" + v.map(yv).join(", ") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).map(k => ychave(k) + ": " + yv(v[k])).join(", ") + "}";
  if (typeof v === "string") return JSON.stringify(v);
  if (v === null || v === undefined) return '""';
  return String(v);
}
function blocoLista(chave, arr, ind) {
  arr = arr || [];
  if (!arr.length) return ind + chave + ": []\n";
  return ind + chave + ":\n" + arr.map(x => ind + "  - " + yv(x) + "\n").join("");
}
const CAMPOS_PESQ = ["nome", "ativa", "consulta", "obrigatorias", "palavras", "excluir", "limite_alerta", "limite_resumo", "feeds_extra", "paginas_extra"];
const CAMPOS_SIMPLES = ["nome", "ativa", "sitio", "assuntos", "excluir", "feeds_extra", "paginas_extra"];
function yamlPesquisas(ps) {
  if (!ps.length) return "pesquisas: []\n";
  let o = "pesquisas:\n";
  ps.forEach(p => {
    if (p.assuntos) {  // formato simples (3 perguntas); as regras antigas deixam de ser escritas
      o += "  - nome: " + yv(p.nome) + "\n";
      o += "    ativa: " + (p.ativa !== false) + "\n";
      o += "    sitio: " + yv(p.sitio || "") + "\n";
      o += blocoLista("assuntos", p.assuntos, "    ");
      o += "    excluir: " + yv(p.excluir || []) + "\n";
      o += blocoLista("feeds_extra", p.feeds_extra, "    ");
      o += blocoLista("paginas_extra", p.paginas_extra, "    ");
      Object.keys(p).forEach(k => { if (!CAMPOS_SIMPLES.includes(k) && !CAMPOS_PESQ.includes(k)) o += "    " + ychave(k) + ": " + yv(p[k]) + "\n"; });
      return;
    }
    const pal = p.palavras || {};
    o += "  - nome: " + yv(p.nome) + "\n";
    o += "    ativa: " + (p.ativa !== false) + "\n";
    o += "    consulta: " + yv(p.consulta || "") + "\n";
    o += "    obrigatorias: " + yv(p.obrigatorias || []) + "\n";
    o += "    palavras:\n      alta: " + yv(pal.alta || []) + "\n      media: " + yv(pal.media || []) + "\n      baixa: " + yv(pal.baixa || []) + "\n";
    o += "    excluir: " + yv(p.excluir || []) + "\n";
    o += "    limite_alerta: " + Number(p.limite_alerta || 25) + "\n";
    o += "    limite_resumo: " + Number(p.limite_resumo || 10) + "\n";
    o += blocoLista("feeds_extra", p.feeds_extra, "    ");
    o += blocoLista("paginas_extra", p.paginas_extra, "    ");
    Object.keys(p).forEach(k => { if (!CAMPOS_PESQ.includes(k)) o += "    " + ychave(k) + ": " + yv(p[k]) + "\n"; });
  });
  return o;
}
function yamlFontes(f) {
  let o = "fontes:\n";
  ["confiaveis", "neutras", "bloqueadas"].forEach(k => { o += "  " + k + ": " + yv(f[k] || []) + "\n"; });
  o += blocoLista("feeds", f.feeds, "  ");
  o += blocoLista("paginas", f.paginas, "  ");
  Object.keys(f).forEach(k => { if (!["confiaveis", "neutras", "bloqueadas", "feeds", "paginas"].includes(k)) o += "  " + ychave(k) + ": " + yv(f[k]) + "\n"; });
  return o;
}
function substituirSecao(texto, chave, novo) {
  const L = texto.split(/\r?\n/);
  const ini = L.findIndex(l => l.startsWith(chave + ":"));
  const nl = novo.replace(/\n$/, "").split("\n");
  if (ini < 0) return texto.replace(/\s*$/, "\n\n") + nl.join("\n") + "\n";
  let fim = L.length;
  for (let i = ini + 1; i < L.length; i++) if (/^[A-Za-z_]/.test(L[i])) { fim = i; break; }
  if (fim < L.length) while (fim - 1 > ini && (/^#/.test(L[fim - 1]) || L[fim - 1].trim() === "")) fim--;
  const resto = L.slice(fim);
  while (resto.length && resto[0].trim() === "") resto.shift();
  return L.slice(0, ini).concat(nl, resto.length ? [""] : [], resto).join("\n").replace(/\n*$/, "\n");
}
// o que foi pedido está no que ficou gravado? (sem ligar à ordem das chaves, a valores que
// o painel completa por omissão, nem a "20" vs 20)
function contido(pedido, obtido) {
  if (pedido === null || pedido === undefined) return true;
  if (Array.isArray(pedido)) return Array.isArray(obtido) && pedido.length === obtido.length && pedido.every((x, i) => contido(x, obtido[i]));
  if (typeof pedido === "object") return !!obtido && typeof obtido === "object" && Object.keys(pedido).every(k => contido(pedido[k], obtido[k]));
  return String(pedido) === String(obtido);
}
// lê o config.yaml mais recente, aplica a mudança, confirma que o resto ficou igual e grava
// frequência: geral.intervalo_minutos (o workflow acorda de 15 em 15 min e respeita isto; mínimo 30)
const INTERVALOS = [[30, "30 minutos"], [45, "45 minutos"], [60, "1 hora"], [120, "2 horas"], [180, "3 horas"], [360, "6 horas"], [720, "12 horas"], [1440, "1 vez por dia"]];
function intervaloAtual() { const v = Number(((S.config || {}).geral || {}).intervalo_minutos); return v >= 30 ? v : 30; }
async function mudarIntervalo(min) {
  const f = await lerFicheiro("config.yaml");
  const cfg = jsyaml.load(f.texto) || {};
  // só mexe dentro da secção "geral:" (do seu início até à próxima chave do topo)
  const L = f.texto.split(/\r?\n/);
  const ini = L.findIndex(l => /^geral:[ \t]*(#.*)?$/.test(l));
  if (ini < 0) throw new Error("Não encontrei a secção 'geral' no config.yaml. Muda o intervalo diretamente no GitHub.");
  let fim = L.length;
  for (let i = ini + 1; i < L.length; i++) if (/^[A-Za-z_]/.test(L[i])) { fim = i; break; }
  const j = L.slice(ini + 1, fim).findIndex(l => /^\s+intervalo_minutos:/.test(l));
  if (j >= 0) L[ini + 1 + j] = L[ini + 1 + j].replace(/^(\s+intervalo_minutos:[ \t]*)\d*/, "$1" + min);
  else L.splice(ini + 1, 0, "  intervalo_minutos: " + min + "           # de quantos em quantos minutos procura (mínimo 30)");
  const texto = L.join("\n");
  const conf = jsyaml.load(texto) || {};
  if (!conf.geral) throw new Error("Não consegui ler a secção 'geral' depois da mudança. Nada foi gravado.");
  const geralAntes = Object.assign({}, cfg.geral || {}), geralDepois = Object.assign({}, conf.geral || {});
  delete geralAntes.intervalo_minutos; delete geralDepois.intervalo_minutos;
  for (const k of Object.keys(cfg)) if (k !== "geral" && JSON.stringify(cfg[k]) !== JSON.stringify(conf[k])) throw new Error("A gravação ia estragar a secção '" + k + "'. Nada foi gravado.");
  if (JSON.stringify(geralAntes) !== JSON.stringify(geralDepois) || conf.geral.intervalo_minutos !== min) throw new Error("A gravação ia mudar mais do que o intervalo. Nada foi gravado.");
  await gravarFicheiro("config.yaml", texto, f.sha, "painel: verificar de " + min + " em " + min + " minutos");
  S.config = conf;
}
async function mudarConfig(chave, alterar, mensagem) {
  const f = await lerFicheiro("config.yaml");
  const cfg = jsyaml.load(f.texto) || {};
  const nova = alterar(JSON.parse(JSON.stringify(cfg[chave] || (chave === "pesquisas" ? [] : {}))));
  const texto = substituirSecao(f.texto, chave, chave === "pesquisas" ? yamlPesquisas(nova) : yamlFontes(nova));
  const conf = jsyaml.load(texto);
  for (const k of Object.keys(cfg)) if (k !== chave && JSON.stringify(cfg[k]) !== JSON.stringify(conf[k])) throw new Error("A gravação ia estragar a secção '" + k + "'. Nada foi gravado.");
  if (!contido(nova, conf[chave])) throw new Error("A gravação não ficou igual ao pedido. Nada foi gravado.");
  await gravarFicheiro("config.yaml", texto, f.sha, mensagem);
  S.config = conf;
}

// ------------------------------------------------------------ carregar
async function carregar(silencioso) {
  if (!silencioso) { S.erroCarga = ""; render(); }
  try {
    const [c, e, r, p] = await Promise.all([
      lerFicheiro("config.yaml"),
      lerFicheiro("estado.json").catch(() => ({ texto: "{}" })),
      gh("/repos/" + S.repo + "/actions/workflows/" + WORKFLOW + "/runs?per_page=12").catch(() => ({ workflow_runs: [] })),
      lerFicheiro("painel.json").catch(() => ({ texto: "{}" })),
    ]);
    S.config = jsyaml.load(c.texto) || {};
    try { S.estado = JSON.parse(e.texto); } catch (x) { S.estado = {}; }
    let pj = {}; try { pj = JSON.parse(p.texto) || {}; } catch (x) { pj = {}; }
    S.descartados = pj.descartados || [];
    S.limpoAte = pj.atividade_limpa_ate || lsGet(LS_LIMPO, "") || "";
    esconderDescartados();
    S.runs = (r && r.workflow_runs) || [];
    S.erroCarga = "";
  } catch (x) { S.erroCarga = x.message; }
  render();
}

// ------------------------------------------------------------ descartar adiados / resumo
// O painel não grava o estado.json (é do agregador). Grava os ids em painel.json e o
// agregador tira essas notícias dos adiados e do resumo no início de cada execução.
function esconderDescartados() {
  const ids = new Set(S.descartados.map(x => x.id));
  if (!S.estado || !ids.size) return;
  ["adiados", "resumo"].forEach(k => { S.estado[k] = (S.estado[k] || []).filter(c => !(c.ids || []).some(i => ids.has(i))); });
}
async function descartar(ids, rotulo) {
  if (!S.token) throw new Error("Para descartar, junta primeiro um token em Ligação.");
  ids = ids.filter(i => /^[0-9a-f]{6,40}$/.test(i));
  if (!ids.length) throw new Error("Esta notícia não tem identificador; não dá para a descartar.");
  let atual = { descartados: [] }, sha;
  try { const f = await lerFicheiro("painel.json"); atual = JSON.parse(f.texto); sha = f.sha; } catch (e) { if (!/Não encontrei/.test(e.message)) throw e; }
  const limite = Date.now() - 30 * 86400000, agora = new Date().toISOString();
  const lst = (atual.descartados || []).filter(x => x && x.id && new Date(x.ts).getTime() > limite);
  const ja = new Set(lst.map(x => x.id));
  ids.forEach(i => { if (!ja.has(i)) { lst.push({ id: i, ts: agora }); ja.add(i); } });
  atual.descartados = lst;
  await gravarFicheiro("painel.json", JSON.stringify(atual, null, 1) + "\n", sha, "painel: descartar " + rotulo);
  S.descartados = lst; esconderDescartados();
}

const ACOES = { normal: "Verificar agora", simular: "Simular", teste: "Testar Telegram", "descobrir-fontes": "Procurar fontes novas" };
async function correr(acao) {
  if (!S.token) { toast("Para correr ações, junta primeiro um token em Ligação."); S.tab = "ligacao"; render(); return; }
  const antes = Date.now();
  await gh("/repos/" + S.repo + "/actions/workflows/" + WORKFLOW + "/dispatches", { method: "POST", body: { ref: S.ramo, inputs: { acao: acao } } });
  toast("Pedido enviado: " + ACOES[acao] + ". Demora 1 a 2 minutos.");
  S.aSeguir = { acao: acao, desde: antes, run: null };
  render(); seguir();
}
async function seguir() {
  const s = S.aSeguir; if (!s) return;
  for (let i = 0; i < 45 && S.aSeguir === s; i++) {
    await new Promise(r => setTimeout(r, 8000));
    try {
      const r = await gh("/repos/" + S.repo + "/actions/workflows/" + WORKFLOW + "/runs?per_page=5&event=workflow_dispatch");
      const run = (r.workflow_runs || []).find(x => x.display_title === s.acao && new Date(x.created_at).getTime() >= s.desde - 60000);
      if (run) { s.run = run; render(); if (run.status === "completed") break; }
    } catch (e) { /* tenta de novo */ }
  }
  if (S.aSeguir === s) {
    const ok = s.run && s.run.conclusion === "success";
    toast(s.run && s.run.status === "completed" ? (ok ? ACOES[s.acao] + ": concluído." : ACOES[s.acao] + ": falhou. Vê o registo.") : "Ainda a correr. Vê em Atividade.");
    await carregar(true);
  }
}

function linhasFontes(arr) { return (arr || []).map(f => [f.nome || "", f.url || ""].concat(f.local ? ["local"] : []).join(" | ")).join("\n"); }
function lerLinhasFontes(txt, antigas) {
  return String(txt || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    // "Nome | https://endereço | local": o endereço vai do "http" até ao "| local" final,
    // por isso pode ter "|" lá dentro
    let local = false;
    let resto = l.replace(/\s*\|\s*local\s*$/i, () => { local = true; return ""; });
    let nome = "", url = "";
    const m = resto.match(/^(.*?)\|\s*(https?:\/\/.*)$/i);
    if (m) { nome = m[1].trim(); url = m[2].trim(); }
    else if (/^https?:\/\//i.test(resto)) { url = resto.trim(); }
    else { nome = resto.trim(); }
    const ant = (antigas || []).find(a => a.url === url) || {};
    const o = Object.assign({}, ant, { nome: nome || dominio(url), url: url });
    if (local) o.local = true; else delete o.local;
    return o;
  });
}
// "Sertã / sertanense" (config) <-> "Sertã, sertanense" (formulário)
function paraVirgulas(t) { return String(t || "").split("/").map(x => x.trim()).filter(Boolean).join(", "); }
function deVirgulas(t) { return String(t || "").split(/[,\/]/).map(x => x.trim()).filter(Boolean).join(" / "); }
// As 3 perguntas de uma pesquisa (converte as do formato antigo)
function perguntas(p) {

  const ob = p.obrigatorias || [], alta = (p.palavras || {}).alta || [];
  return { sitio: ob.length > 1 ? ob[0] : "", assuntos: (ob.length > 1 ? ob.slice(1) : ob).concat(alta).filter((x, i, a) => a.indexOf(x) === i) };
}
function rascunhoDe(p) {

    excluir: (p.excluir || []).join(", "), feeds: linhasFontes(p.feeds_extra), paginas: linhasFontes(p.paginas_extra) };

function htmlExp() {
  const e = S.exp;

  const reg = e.run ? ' · <a href="' + esc(urlSegura(e.run.html_url)) + '" target="_blank" rel="noopener">ver registo</a>' : "";
  if (e.estado === "a correr") return '<div class="exp"><div><span class="tag info">a experimentar…</span> <span class="sm muted">1 a 3 minutos' + reg + "</span></div></div>";
  if (e.estado === "erro") return '<div class="exp"><div class="err">' + esc(e.msg) + reg + "</div></div>";
  const d = e.res, c = d.cortes || {}, ex = d.exemplos || {};
  let h = '<div class="exp"><div class="xs muted">Procurou no Google Notícias <code>' + esc(d.consulta || "—") + "</code> e nas fontes gerais: " + num(d.recolhidas) + " notícias lidas.</div>";
  h += "<h3>" + (d.n_passam ? "Passam " + num(d.n_passam) : "Não passa nenhuma") + "</h3>";
  if (!d.n_passam) h += '<div class="sm muted">Pode ser normal (não houve notícias destas nas últimas ' + num(d.idade_max_horas) + ' h). Vê em baixo as que foram cortadas, sobretudo as que <b>falam do sítio</b>: se alguma te interessava, falta um assunto.</div>';
  (d.passam || []).forEach(n => {
    const ach = n.achadas ? [].concat(n.achadas.alta || [], n.achadas.media || [], n.achadas.baixa || []) : [];
    h += '<div class="list-item" style="display:block"><span class="tag ' + (n.nivel === "alerta" ? "bad" : "warn") + '">' + (n.nivel === "alerta" ? "mensagem" : "resumo") + '</span> <a class="title-link sm" href="' + esc(urlSegura(n.link)) + '" target="_blank" rel="noopener">' + esc(n.titulo) + '</a><div class="xs muted">' + esc(n.fonte || "") + (ach.length ? " · encontrou: " + esc(ach.join(", ")) : "") + "</div></div>";
  });
  const grupo = (k, rot) => {
    if (!c[k]) return "";
    const lst = (ex[k] || []).map(n => '<div class="xs">· <a href="' + esc(urlSegura(n.link)) + '" target="_blank" rel="noopener">' + esc(n.titulo) + '</a> <span class="muted">(' + esc(n.fonte || "") + ")</span></div>").join("");
    return "<details><summary>" + rot + ": " + num(c[k]) + "</summary>" + (lst ? '<div style="margin-top:6px">' + lst + (c[k] > (ex[k] || []).length ? '<div class="xs muted">… e mais ' + num(c[k] - (ex[k] || []).length) + "</div>" : "") + "</div>" : "") + "</details>";
  };
  h += '<div class="sm" style="margin-top:8px"><b>Cortadas</b></div>';
  h += grupo("sem_assunto", d.sitio_vazio ? "Sem nenhum dos assuntos" : "Falam do sítio, mas não de um assunto");
  h += grupo("sem_sitio", "Não falam do sítio");
  h += grupo("excluida", "Têm uma palavra a excluir");
  h += grupo("antiga", "Mais antigas que " + num(d.idade_max_horas) + " h");
  (d.falhas || []).forEach(f => { h += '<div class="xs err">Fonte com falha: ' + esc(f) + "</div>"; });
  return h + "</div>";
}
function mostrarExp() {
  const el = document.getElementById("f-exp"); if (el) el.innerHTML = htmlExp();
  const b = document.querySelector('[data-a="experimentar"]'); if (b) b.disabled = !!(S.exp && S.exp.estado === "a correr");
}
async function experimentar() {
  if (S.exp && S.exp.estado === "a correr") return;
  const nova = pesquisaDoFormulario(); if (!nova) return;
  const pedido = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const desde = Date.now();
  const e = S.exp = { estado: "a correr", pedido: pedido, run: null };
  mostrarExp();
  try {
    await gh("/repos/" + S.repo + "/actions/workflows/" + WORKFLOW + "/dispatches", { method: "POST", body: { ref: S.ramo, inputs: { acao: "experimentar", pesquisa: JSON.stringify(Object.assign({}, nova, { pedido: pedido })) } } });
  } catch (err) { S.exp = { estado: "erro", msg: err.message }; mostrarExp(); return; }
  for (let i = 0; i < 40 && S.exp === e; i++) {
    await new Promise(r => setTimeout(r, 8000));
    if (S.exp !== e) return;
    try {
      const d = JSON.parse((await lerFicheiro("experimentar.json")).texto);
      if (d.pedido === pedido) { d.sitio_vazio = !nova.sitio; S.exp = { estado: "pronto", res: d, run: e.run }; mostrarExp(); return; }
    } catch (err) { /* ainda não existe: tenta de novo */ }
    try {
      const r = await gh("/repos/" + S.repo + "/actions/workflows/" + WORKFLOW + "/runs?per_page=10&event=workflow_dispatch");
      const run = (r.workflow_runs || []).find(x => x.display_title === "experimentar" && new Date(x.created_at).getTime() >= desde - 60000);
      if (run) {
        e.run = run;
        if (run.status === "completed" && run.conclusion !== "success") { S.exp = { estado: "erro", msg: "A experiência falhou no GitHub.", run: run }; mostrarExp(); return; }
      }
    } catch (err) { /* tenta de novo */ }
    if (S.exp === e) mostrarExp();
  }
  if (S.exp === e) { S.exp = { estado: "erro", msg: "Está a demorar mais do que o costume. Tenta outra vez daqui a pouco.", run: e.run }; mostrarExp(); }
}

function slug(t) { return t.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-"); }
async function carregarAjuda() {
  S.ajuda = { aCarregar: true };
  try {
    const f = await lerFicheiro("README.md");

    div.innerHTML = DOMPurify.sanitize(marked.parse(f.texto));
    div.querySelectorAll("h1,h2,h3,h4").forEach(h => { h.id = "doc-" + slug(h.textContent); });
    div.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (href.startsWith("#")) { let alvo = href.slice(1); try { alvo = decodeURIComponent(alvo); } catch (e) {} a.setAttribute("href", "#doc-" + alvo); }
      else { a.target = "_blank"; a.rel = "noopener"; }
    });
    div.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tabela"; t.replaceWith(w); w.appendChild(t); });
    S.ajuda = { html: div.innerHTML };
  } catch (e) { S.ajuda = { erro: e.message }; }
  if (S.tab === "ajuda") render();
}
function vistaAjuda() {
  if (!S.ajuda) carregarAjuda();
  const a = S.ajuda || {};
  const h = '<div class="top"><h1>Ajuda</h1><button class="btn btn-sm" data-a="recarregar-ajuda">Atualizar</button></div>';

  if (!a.html) return h + '<div class="card"><div class="empty">A carregar o README…</div></div>';
  return h + '<div class="card doc">' + a.html + "</div>";
}

async function ocupado(btn, fn) {
  if (S.ocupado) return;
  S.ocupado = true; const txt = btn ? btn.textContent : ""; if (btn) { btn.disabled = true; btn.textContent = "A gravar…"; }
  try { await fn(); } catch (e) { toast(e.message); const fe = document.getElementById("f-erro"); if (fe) fe.textContent = e.message; if (btn) { btn.disabled = false; btn.textContent = txt; } }
  finally { S.ocupado = false; }
}

  const nomeOrig = orig ? orig.nome : null;
  await ocupado(btn, async () => {
    await mudarConfig("pesquisas", lst => {
      const i = nomeOrig === null ? -1 : lst.findIndex(p => p.nome === nomeOrig);
      if (i >= 0) lst[i] = nova; else lst.push(nova);
      return lst;
    }, (orig ? "painel: editar a pesquisa " : "painel: criar a pesquisa ") + nova.nome);
    S.editar = null; S.rascunho = null; S.exp = null; toast("Pesquisa guardada no GitHub. Vale a partir da próxima verificação."); render();
  });
}
async function onClick(ev) {
  const el = ev.target.closest("[data-a],[data-tab]"); if (!el) return;
  if (el.dataset.tab) { S.tab = el.dataset.tab; S.editar = null; lsSet(LS_TAB, S.tab); render(); document.getElementById("main").scrollTop = 0; return; }
  const a = el.dataset.a, p = el.dataset.p, d = el.dataset.d;
  const ps = (S.config && S.config.pesquisas) || [];
  if (a === "tab") { ev.preventDefault(); S.tab = p; S.editar = null; lsSet(LS_TAB, p); render(); document.getElementById("main").scrollTop = 0; return; }
  if (a === "recarregar") { await carregar(); toast("Atualizado."); return; }
  if (a === "recarregar-ajuda") { S.ajuda = null; render(); return; }
  if (a === "correr") { try { await correr(p); } catch (e) { toast(e.message); } return; }
  if (a === "nova") { if (!S.token) { toast("Para criar pesquisas, junta primeiro um token em Ligação."); return; } S.editar = -1; S.rascunho = null; S.exp = null; render(); return; }
  if (a === "editar") { if (!S.token) { toast("Para editar, junta primeiro um token em Ligação."); return; } S.editar = Number(p); S.rascunho = null; S.exp = null; render(); return; }
  if (a === "cancelar") { S.editar = null; S.rascunho = null; S.exp = null; render(); return; }
  if (a === "experimentar") { await experimentar(); return; }
  if (a === "guardar") { await guardarPesquisa(el); return; }
  if (a === "pausar") {
    const alvo = ps[Number(p)];
    await ocupado(el, async () => { await mudarConfig("pesquisas", lst => { lst.forEach(x => { if (x.nome === alvo.nome) x.ativa = x.ativa === false; }); return lst; }, "painel: " + (alvo.ativa === false ? "ativar" : "pausar") + " a pesquisa " + alvo.nome); toast("Feito."); render(); });
    return;
  }
  if (a === "apagar") {
    const alvo = ps[Number(p)];
    if (!confirm('Apagar a pesquisa "' + alvo.nome + '"? Isto não se pode desfazer no painel.')) return;
    await ocupado(el, async () => { await mudarConfig("pesquisas", lst => lst.filter(x => x.nome !== alvo.nome), "painel: apagar a pesquisa " + alvo.nome); toast("Pesquisa apagada."); render(); });
    return;
  }
  if (a === "decidir" || a === "juntar" || a === "tirar") {
    let dom = d;
    if (a === "juntar") { dom = dominio(/^https?:/i.test(document.getElementById("add-" + p).value.trim()) ? document.getElementById("add-" + p).value.trim() : "https://" + document.getElementById("add-" + p).value.trim()).toLowerCase(); if (!/^([a-z0-9-]+\.)*[a-z]{2,}$/.test(dom)) { toast("Escreve um domínio, por exemplo publico.pt (ou só br para todos os sites .br)"); return; } }
    const sug = ((S.estado || {}).sugeridas || {})[dom];
    await ocupado(el, async () => {
      await mudarConfig("fontes", f => {
        ["confiaveis", "neutras", "bloqueadas"].forEach(k => { f[k] = (f[k] || []).filter(x => x !== dom); });
        if (a !== "tirar") f[p] = (f[p] || []).concat([dom]);
        if (a === "decidir" && p === "confiaveis" && sug && sug.feed && !(f.feeds || []).some(x => x.url === sug.feed)) f.feeds = (f.feeds || []).concat([{ nome: sug.nome, url: sug.feed }]);
        return f;
      }, "painel: " + (a === "tirar" ? "tirar " + dom + " de " + p : dom + " em " + p));
      if (a === "decidir" && S.estado && S.estado.sugeridas) delete S.estado.sugeridas[dom];
      toast(a === "tirar" ? "Retirado." : dom + " guardado em " + p + "."); render();
    });
    return;
  }
  if (a === "gravar-intervalo") {
    if (!S.token) { toast("Para mudar a frequência, junta primeiro um token em Ligação."); return; }
    const min = Number(document.getElementById("intervalo").value);
    if (!(min >= 30 && min <= 1440)) { toast("Escolhe um intervalo entre 30 minutos e 1 dia."); return; }
    await ocupado(el, async () => { await mudarIntervalo(min); toast("Guardado. Nova frequência: " + (INTERVALOS.find(([m]) => m === min) || [0, min + " minutos"])[1] + "."); render(); });
    return;
  }
  if (a === "gravar-gerais") {
    const feeds = lerLinhasFontes(document.getElementById("g-feeds").value, (S.config.fontes || {}).feeds);
    const pags = lerLinhasFontes(document.getElementById("g-paginas").value, (S.config.fontes || {}).paginas);
    if (![...feeds, ...pags].every(f => /^https?:\/\//i.test(f.url))) { toast("Há uma fonte sem endereço válido (tem de começar por https://)."); return; }
    await ocupado(el, async () => { await mudarConfig("fontes", f => { f.feeds = feeds; f.paginas = pags; return f; }, "painel: feeds e sites gerais"); toast("Guardado no GitHub."); render(); });
    return;
  }
  if (a === "gravar-worker") {
    const w = document.getElementById("l-worker").value.trim().replace(/\/+$/, "");
    if (w && !/^https:\/\/[\w.-]+$/i.test(w)) { toast("Escreve o endereço completo, a começar por https://"); return; }
    S.worker = w; lsSet(LS_LIG, JSON.stringify({ repo: S.repo, worker: w })); toast("Guardado neste navegador."); render(); return;
  }
  if (a === "ligar") {
    const repo = document.getElementById("l-repo").value.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\/$/, "");
    const tok = document.getElementById("l-token").value.trim();
    const res = document.getElementById("l-res");
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { res.innerHTML = '<span class="err">Escreve o repositório como dono/nome.</span>'; return; }
    S.repo = repo; lsSet(LS_LIG, JSON.stringify({ repo: repo, worker: S.worker }));
    if (tok) { S.token = tok; lsSet(LS_TOKEN, tok); }
    res.textContent = "A testar…";
    try {
      const info = await gh("/repos/" + S.repo);
      const pode = info.permissions && info.permissions.push;
      res.innerHTML = S.token ? (pode ? '<span class="tag ok">Ligado: podes ler e gravar.</span>' : '<span class="err">O token liga, mas não tem permissão de escrita (Contents: Read and write).</span>') : '<span class="tag">Ligado em só leitura.</span>';
      await carregar(true);
    } catch (e) { res.innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
    return;
  }
  if (a === "ver-tudo") { ev.preventDefault(); S.verTudo = !S.verTudo; render(); return; }
  if (a === "limpar-atividade") {
    const agora = new Date().toISOString();
    S.verTudo = false;
    if (!S.token) { S.limpoAte = agora; lsSet(LS_LIMPO, agora); toast("Limpo neste aparelho. Com o token, a limpeza vale em todos."); render(); return; }
    await ocupado(el, async () => {
      let atual = {}, sha;
      try { const f = await lerFicheiro("painel.json"); atual = JSON.parse(f.texto) || {}; sha = f.sha; } catch (e) { if (!/Não encontrei/.test(e.message)) throw e; }
      atual.atividade_limpa_ate = agora;
      await gravarFicheiro("painel.json", JSON.stringify(atual, null, 1) + "\n", sha, "painel: limpar a atividade");
      S.limpoAte = agora; lsSet(LS_LIMPO, agora);
      toast("Limpo. Só aparece o que acontecer a partir de agora."); render();
    });
    return;
  }
  if (a === "descartar" || a === "descartar-todos") {
    let ids, rotulo;
    if (a === "descartar") { ids = (el.dataset.ids || "").split(","); rotulo = "1 notícia"; }
    else {
      const fila = (S.estado && S.estado[p]) || [];
      if (!confirm("Descartar " + fila.length + (p === "adiados" ? " alertas adiados?" : " notícias do resumo?") + " Não vão ser enviadas.")) return;
      ids = [].concat.apply([], fila.map(c => c.ids || [])); rotulo = fila.length + " notícias (" + p + ")";
    }
    await ocupado(el, async () => { await descartar(ids, rotulo); toast("Descartado. Não vai ser enviado."); render(); });
    return;
  }
  if (a === "esquecer") { S.token = ""; lsSet(LS_TOKEN, null); toast("Token esquecido neste aparelho."); render(); return; }
}
document.addEventListener("click", onClick);
render();
carregar();
setInterval(() => {
  const foco = document.activeElement;
  if (S.ocupado || S.editar !== null || document.hidden || ["fontes", "ligacao"].includes(S.tab)) return;
  if (foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return;
  carregar(true);
}, 5 * 60000);
</script>
