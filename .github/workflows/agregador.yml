name: Agregador de Notícias
run-name: ${{ github.event_name == 'schedule' && 'automática' || (github.event.inputs.acao == 'agendada' && 'automática (Google)' || github.event.inputs.acao) }}

# O GitHub acorda o workflow de 15 em 15 minutos e um script da Google
# (extras/despertador-google.gs) chama-o também com a ação "agendada", porque o agendador do
# GitHub salta muitas execuções. O job "decidir" vê se já passou geral.intervalo_minutos
# (.github/ja_e_altura.py); só então corre o job "correr". Os pedidos manuais correm sempre.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options:
          - normal
          - teste
          - simular
          - descobrir-fontes
          - agendada
        default: normal

permissions:
  contents: write

jobs:
  # Sem fila: as execuções que acabam em "ainda não é altura" não ficam à espera nem
  # cancelam um pedido manual que esteja na fila do job "correr".
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      correr: ${{ steps.hora.outputs.correr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ver se já é altura de verificar
        id: hora
        env:
          ACAO: ${{ github.event.inputs.acao }}
        run: python3 .github/ja_e_altura.py

  correr:
    needs: decidir
    if: needs.decidir.outputs.correr == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # uma execução de cada vez, para o estado.json não ser gravado por duas ao mesmo tempo
    concurrency:
      group: agregador
      cancel-in-progress: false
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # o estado mais recente, mesmo que outra execução tenha acabado de o gravar

      # Volta a confirmar com o estado mais recente (outra execução pode ter corrido
      # enquanto esta esperava na fila).
      - name: Confirmar que ainda é altura
        id: hora
        env:
          ACAO: ${{ github.event.inputs.acao }}
        run: python3 .github/ja_e_altura.py

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.correr == 'sim'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        if: steps.hora.outputs.correr == 'sim'
        run: pip install -r requirements.txt

      # Sites que recusam o GitHub (ex.: Câmara da Sertã) são trazidos pela internet do
      # telemóvel, via Tailscale. Sem os segredos TS_*, ou com o telemóvel sem rede,
      # estes passos não fazem nada e o resto corre igual.
      - name: Ligar ao telemóvel (Tailscale)
        id: tailscale
        if: steps.hora.outputs.correr == 'sim' && env.TS_OAUTH_CLIENT_ID != '' && github.event.inputs.acao != 'teste'
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false

      - name: Buscar pelo telemóvel os sites bloqueados
        if: steps.hora.outputs.correr == 'sim' && steps.tailscale.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: python agregador.py --buscar-pelo-telemovel

      - name: Executar
        if: steps.hora.outputs.correr == 'sim'
        env:
          WHATSAPP_TELEFONE: ${{ secrets.WHATSAPP_TELEFONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          ACAO: ${{ github.event.inputs.acao || 'normal' }}
        run: |
          case "$ACAO" in
            teste) python agregador.py --teste ;;
            simular) python agregador.py --simular ;;
            descobrir-fontes) python agregador.py --fontes ;;
            *) python agregador.py ;;
          esac

      - name: Guardar estado
        if: always() && steps.hora.outputs.correr == 'sim'
        run: |
          git config user.name "agregador-bot"
          git config user.email "agregador-bot@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then
            echo "Sem alterações no estado."
            exit 0
          fi
          git commit -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
          for tentativa in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              echo "Estado gravado."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Não consegui gravar o estado.json no repositório (3 tentativas)."
          exit 1
