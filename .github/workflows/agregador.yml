name: Agregador de Notícias
run-name: ${{ github.event_name == 'schedule' && 'automática (GitHub)' || (github.event.inputs.acao == 'agendada' && 'automática (cron externo)' || github.event.inputs.acao) }}

# O GitHub acorda o workflow de 15 em 15 minutos. O primeiro passo
# vê no config.yaml de quantos em quantos minutos queres verificar (geral.intervalo_minutos)
# e, se ainda não for altura, termina logo sem fazer nada. Como o agendador do GitHub falha
# muitas vezes, um serviço externo (cron-job.org) chama também este workflow com a ação
# "agendada", que respeita o mesmo intervalo.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options:
          - normal
          - teste
          - simular
          - descobrir-fontes
          - agendada
        default: normal

permissions:
  contents: write

concurrency:
  group: agregador
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # o estado mais recente, mesmo que outra execução tenha acabado de o gravar

      - name: Ver se já é altura de verificar
        id: hora
        env:
          ACAO: ${{ github.event.inputs.acao }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          from datetime import datetime, timezone
          correr, motivo = True, "pedido manual"
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" or os.environ.get("ACAO") == "agendada":
              texto = open("config.yaml", encoding="utf-8").read()
              m = re.search(r"(?m)^\s+intervalo_minutos:\s*(\d+)", texto)
              intervalo = max(30, int(m.group(1))) if m else 30
              try:
                  execucoes = json.load(open("estado.json", encoding="utf-8")).get("execucoes") or []
                  ultima = datetime.fromisoformat(execucoes[-1]["ts"]) if execucoes else None
              except (OSError, ValueError, KeyError):
                  ultima = None
              if ultima is None:
                  motivo = f"primeira verificação (intervalo {intervalo} min)"
              else:
                  passou = (datetime.now(timezone.utc) - ultima).total_seconds() / 60
                  # 2,5 min de folga: o GitHub não acorda o workflow ao segundo
                  correr = passou >= intervalo - 2.5
                  motivo = f"última verificação há {passou:.0f} min; intervalo {intervalo} min"
          print(("A verificar: " if correr else "Ainda não é altura: ") + motivo)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("correr=" + ("sim" if correr else "nao") + "\n")
          EOF

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.correr == 'sim'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        if: steps.hora.outputs.correr == 'sim'
        run: pip install -r requirements.txt

      # Sites que recusam o GitHub (ex.: Câmara da Sertã) são trazidos pela internet do
      # telemóvel, via Tailscale. Sem os segredos TS_*, ou com o telemóvel sem rede,
      # estes passos não fazem nada e o resto corre igual.
      - name: Ligar ao telemóvel (Tailscale)
        id: tailscale
        if: steps.hora.outputs.correr == 'sim' && env.TS_OAUTH_CLIENT_ID != '' && github.event.inputs.acao != 'teste'
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false

      - name: Buscar pelo telemóvel os sites bloqueados
        if: steps.hora.outputs.correr == 'sim' && steps.tailscale.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: python agregador.py --buscar-pelo-telemovel

      - name: Executar
        if: steps.hora.outputs.correr == 'sim'
        env:
          WHATSAPP_TELEFONE: ${{ secrets.WHATSAPP_TELEFONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          ACAO: ${{ github.event.inputs.acao || 'normal' }}
        run: |
          case "$ACAO" in
            teste) python agregador.py --teste ;;
            simular) python agregador.py --simular ;;
            descobrir-fontes) python agregador.py --fontes ;;
            *) python agregador.py ;;
          esac

      - name: Guardar estado
        if: always() && steps.hora.outputs.correr == 'sim'
        run: |
          git config user.name "agregador-bot"
          git config user.email "agregador-bot@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then
            echo "Sem alterações no estado."
          else
            git commit -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
            for tentativa in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
