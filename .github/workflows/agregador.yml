name: Agregador de Notícias

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options:
          - normal
          - teste
          - simular
          - descobrir-fontes
        default: normal

permissions:
  contents: write

concurrency:
  group: agregador
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Sites que recusam o GitHub (ex.: Câmara da Sertã) são trazidos pela internet do
      # telemóvel, via Tailscale. Sem os segredos TS_*, ou com o telemóvel sem rede,
      # estes passos não fazem nada e o resto corre igual.
      - name: Ligar ao telemóvel (Tailscale)
        id: tailscale
        if: env.TS_OAUTH_CLIENT_ID != '' && github.event.inputs.acao != 'teste'
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false

      - name: Buscar pelo telemóvel os sites bloqueados
        if: steps.tailscale.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: python agregador.py --buscar-pelo-telemovel

      - name: Executar
        env:
          WHATSAPP_TELEFONE: ${{ secrets.WHATSAPP_TELEFONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          ACAO: ${{ github.event.inputs.acao || 'normal' }}
        run: |
          case "$ACAO" in
            teste) python agregador.py --teste ;;
            simular) python agregador.py --simular ;;
            descobrir-fontes) python agregador.py --fontes ;;
            *) python agregador.py ;;
          esac

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "agregador-bot"
          git config user.email "agregador-bot@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then
            echo "Sem alterações no estado."
          else
            git commit -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
            for tentativa in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
