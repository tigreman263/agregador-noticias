# Usado quando o Cloudflare publica o Worker a partir do GitHub (Workers Builds, comando
# "cd extras/cloudflare && npx wrangler deploy") ou com o Wrangler no computador.
# Quem colar o worker.js à mão no painel do Cloudflare cria o Cron Trigger lá.
name = "agregador-noticias"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true   # endereço https://agregador-noticias.<conta>.workers.dev (precisa dele o bot)

[triggers]
crons = ["*/15 * * * *"]

# Os segredos definem-se com: npx wrangler secret put GITHUB_TOKEN (e os outros dois)
