# ============================================================
#  CONFIGURAÇÃO DO AGREGADOR DE NOTÍCIAS
#  Edita este ficheiro no GitHub (ícone do lápis) e guarda.
#  As mudanças aplicam-se na verificação seguinte.
# ============================================================

geral:
  fuso: "Europe/Lisbon"
  idade_max_horas: 48          # ignora notícias mais antigas
  max_alertas_por_execucao: 5  # o excesso vai para o resumo diário
  silencio: {inicio: 23, fim: 7}   # não envia alertas nestas horas (ficam guardados)
  hora_resumo: 8               # hora a partir da qual sai o resumo diário
  google_news: {hl: "pt-PT", gl: "PT", ceid: "PT:pt-150"}

pesos:
  pontos: {alta: 10, media: 4, baixa: 1}
  fonte_confiavel: 1.5
  fonte_desconhecida: 1.0
  bonus_fonte_extra: 5         # por cada fonte adicional a publicar o mesmo
  bonus_fonte_extra_max: 15
  bonus_ultima_hora: 3         # notícia com menos de 1 hora

# Fontes: usa o domínio, sem "www" nem "https://".
fontes:
  confiaveis: ["sapo.pt", "mediotejo.net", "radiocondestavel.pt", "noticiasdecoimbra.pt", "radiohertz.pt", "cmjornal.pt", "dnoticias.pt", "rtp.pt", "cnnportugal.iol.pt", "gazetadointerior.pt", "antenalivre.pt", "diariodigitalcastelobranco.pt", "observador.pt", "reconquista.pt", "centralpress.pt", "portal-energia.com", "razaoautomovel.com", "sicnoticias.pt"]
  neutras: []
  bloqueadas: ["br"]
  feeds:
    - {nome: "SAPO", url: "https://sapo.pt/rss/destaques"}
    - {nome: "Médio Tejo", url: "https://mediotejo.net/feed/"}
    - {nome: "Notícias de Coimbra", url: "https://www.noticiasdecoimbra.pt/feed/"}
    - {nome: "Rádio Hertz", url: "https://radiohertz.pt/feed/"}
    - {nome: "dnoticias.pt", url: "https://www.dnoticias.pt/rss.xml"}
    - {nome: "CNN Portugal", url: "https://cnnportugal.iol.pt/rss.xml"}
    - {nome: "Observador", url: "https://observador.pt/feed/"}
    - {nome: "Central Press", url: "https://centralpress.pt/api/rss"}
    - {nome: "Portal Energia", url: "https://www.portal-energia.com/feed/"}
    - {nome: "Razão Automóvel", url: "https://www.razaoautomovel.com/feed/"}
  paginas:
    - {nome: "cm-serta.pt", url: "https://cm-serta.pt/comunicacao/noticias"}

# Descoberta automática de fontes: 1 vez por dia procura sites novos que
# publicam sobre as tuas pesquisas e envia-te uma sugestão pelo Telegram, com
# botões Confiável / Neutra / Bloquear (ou decide no painel, em Fontes).
# Sem decisão em 14 dias, a sugestão é esquecida.
descoberta:
  ativa: true
  hora: 9                      # a partir desta hora, 1 vez por dia
  max_sugestoes_por_dia: 5
  max_pendentes: 10            # não sugere mais se tiveres 10 por decidir
  min_noticias: 2              # o site tem de ter pelo menos 2 notícias relevantes
  procurar_feeds: true         # tenta encontrar o RSS do site para o ler diretamente

# Páginas vigiadas (o painel preenche, no separador Páginas): avisa pelo Telegram
# quando o texto da página muda (datas e horas não contam).
#   parte: seletor CSS opcional (só essa parte da página conta)
#   frequencia: "urgente" (15 min), "hora" ou "diario" (1 vez por dia)
vigiar:
  - nome: "cm-serta"
    url: "https://cm-serta.pt/comunicacao/noticias"
    parte: ""
    frequencia: "urgente"
    ativa: true

# Cada pesquisa tem 4 perguntas (o painel preenche-as):
#   sitio:    a notícia TEM de falar disto (variantes separadas por "/")
#   assuntos: e de PELO MENOS UM destes (cada linha um assunto; variantes com "/")
#   excluir:  se tiver uma destas palavras, é deitada fora
#   frequencia: "urgente" (de 15 em 15 min, mensagem logo), "hora" (de hora a hora,
#               mensagem logo) ou "diario" (tudo no resumo diário)
# A procura no Google Notícias é automática.
pesquisas:
  - nome: "Sertã"
    ativa: true
    sitio: "Sertã / sertanense / sertaginense"
    assuntos:
      - "apoio / subsídio / incentivo / comparticipação / candidatura"
      - "agricultura / agrícola / agricultor"
      - "floresta / florestal"
    excluir: []
    frequencia: "hora"
    feeds_extra: []
    paginas_extra:
      - {nome: "cm-serta.pt", url: "https://cm-serta.pt/comunicacao/noticias", local: true}
  - nome: "Apoio fundo ambiental"
    ativa: true
    sitio: "Fundo Ambiental / Vale Eficiência"
    assuntos: []
    excluir: []
    frequencia: "diario"
    feeds_extra: []
    paginas_extra: []
