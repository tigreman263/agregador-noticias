# ============================================================
#  CONFIGURAÇÃO DO AGREGADOR DE NOTÍCIAS
#  Edita este ficheiro no GitHub (ícone do lápis) e guarda.
#  As mudanças aplicam-se na verificação seguinte.
# ============================================================

geral:
  fuso: "Europe/Lisbon"
  idade_max_horas: 48          # ignora notícias mais antigas
  max_alertas_por_execucao: 5  # o excesso vai para o resumo diário
  silencio: {inicio: 23, fim: 7}   # não envia alertas nestas horas (ficam guardados)
  hora_resumo: 8               # hora a partir da qual sai o resumo diário
  google_news: {hl: "pt-PT", gl: "PT", ceid: "PT:pt-150"}

pesos:
  pontos: {alta: 10, media: 4, baixa: 1}
  fonte_confiavel: 1.5
  fonte_desconhecida: 1.0
  bonus_fonte_extra: 5         # por cada fonte adicional a publicar o mesmo
  bonus_fonte_extra_max: 15
  bonus_ultima_hora: 3         # notícia com menos de 1 hora

# Fontes: usa o domínio, sem "www" nem "https://".
fontes:
  confiaveis: ["sapo.pt", "mediotejo.net", "radiocondestavel.pt", "noticiasdecoimbra.pt", "radiohertz.pt"]
  neutras: []
  bloqueadas: []
  feeds:
    - {nome: "SAPO", url: "https://sapo.pt/rss/destaques"}
    - {nome: "Médio Tejo", url: "https://mediotejo.net/feed/"}
    - {nome: "Notícias de Coimbra", url: "https://www.noticiasdecoimbra.pt/feed/"}
    - {nome: "Rádio Hertz", url: "https://radiohertz.pt/feed/"}
  paginas: []

# Descoberta automática de fontes: 1 vez por dia procura sites novos que
# publicam sobre as tuas pesquisas e envia-te uma sugestão por WhatsApp.
# Para decidir, junta o domínio a fontes.confiaveis, fontes.neutras ou
# fontes.bloqueadas. Sem decisão em 14 dias, a sugestão é esquecida.
descoberta:
  ativa: true
  hora: 9                      # a partir desta hora, 1 vez por dia
  max_sugestoes_por_dia: 5
  max_pendentes: 10            # não sugere mais se tiveres 10 por decidir
  min_noticias: 2              # o site tem de ter pelo menos 2 notícias relevantes
  procurar_feeds: true         # tenta encontrar o RSS do site para o ler diretamente

# Cada pesquisa procura no Google Notícias pela "consulta" e filtra
# com as palavras-chave. Podes ter várias pesquisas.
# "obrigatorias": a notícia só conta se tiver TODAS estas palavras
# (ex: ["sertã"] para não apanhar notícias de outros concelhos).
pesquisas:
  - nome: "Sertã"
    ativa: true
    consulta: "Sertã"
    obrigatorias: ["sertã"]
    palavras:
      alta: ["agricultor", "agricultura", "subsídio", "apoio"]
      media: ["câmara", "município", "municipal", "concelho", "candidatura", "incentivo"]
      baixa: ["sertã"]
    excluir: []
    limite_alerta: 20
    limite_resumo: 4
    feeds_extra:
      - {nome: "Câmara da Sertã", url: "https://cm-serta.pt/comunicacao/noticias?format=feed&type=rss", local: true}
    paginas_extra: []
  - nome: "Apoio Estado"
    ativa: true
    consulta: "Apoios do estado"
    obrigatorias: []
    palavras:
      alta: ["Apoio", "subsidio", "financiamento", "fundo perdido"]
      media: ["agricultura", "floresta"]
      baixa: []
    excluir: ["publicidade"]
    limite_alerta: 25
    limite_resumo: 10
    feeds_extra: []
    paginas_extra: []
